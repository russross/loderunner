[package]
name = "loderunner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[workspace]
members = [".", "src/trace", "src/mame"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }

[dependencies]
crt = { path = "../crt" }
crt-native = { path = "../crt/native" }
lode-trace = { path = "src/trace" }
lode-mame-validation = { path = "src/mame" }
sdl2.workspace = true
serde.workspace = true
serde_json.workspace = true
